<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrinho — Moda à Beira-Mar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="cabecalho"></div>

  <main>
    <section class="pagina">
      <h1>O teu carrinho</h1>
      <div id="resultado-pedido"></div>
      <div id="lista-carrinho"></div>

      <div id="area-pedido" style="display:none">
        <div class="resumo">
          <h2>Resumo da encomenda</h2>
          <div class="linha-resumo"><span>Subtotal</span><span id="resumo-subtotal"></span></div>
          <div class="linha-resumo"><span>Portes de envio</span><span id="resumo-entrega"></span></div>
          <div class="linha-resumo total"><span>Total</span><span id="resumo-total"></span></div>
        </div>

        <div class="checkout">
          <h2>Como pretendes receber?</h2>
          <label class="opcao">
            <input type="radio" name="forma" value="entrega" checked>
            <span><strong>Entrega pelo WhatsApp</strong><small id="texto-entrega"></small></span>
          </label>
          <label class="opcao">
            <input type="radio" name="forma" value="retirada">
            <span><strong>Retirar na loja física</strong><small id="texto-retirada"></small></span>
          </label>

          <div class="campo">
            <label for="nome">O teu nome</label>
            <input id="nome" type="text" placeholder="Nome completo" autocomplete="name">
          </div>
          <div class="campo">
            <label for="telefone">O teu telemóvel</label>
            <input id="telefone" type="tel" placeholder="+351 900 000 000" autocomplete="tel">
          </div>
          <div class="campo">
            <label for="obs">Observações (opcional)</label>
            <textarea id="obs" rows="2" placeholder="Tamanho, cor, morada de entrega..."></textarea>
          </div>

          <button id="btn-finalizar" class="btn">Finalizar encomenda</button>
        </div>
      </div>
    </section>
  </main>

  <div id="rodape"></div>
  <a id="botao-whatsapp" class="flutuante-whatsapp" target="_blank" rel="noopener">WhatsApp</a>

  <script src="js/config.js"></script>
  <script src="js/produtos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
